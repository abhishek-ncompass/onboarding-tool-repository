  #   Properties:
  #     ResourceArn: !Sub 'arn:aws:apigateway:${REGION}::/restapis/${RestApi.RestApiId}/stages/Integration'
  #     WebACLArn: !Sub '${WebACLARN}'          
Outputs:
  RestApiID:
    Description: "API Gateway ID"
    Value: !Ref RestApi
    Export:
      Name: "dev-alike-private-RestApiID"                

